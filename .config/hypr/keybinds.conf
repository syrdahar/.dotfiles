# ──────────────────────────────────────────────────────────────
#  Raccourcis — gestion des fenêtres façon chadwm (config.def.h)
#  adaptée à Hyprland + AZERTY ; tes raccourcis d'apps gardent
#  la priorité (SUPER+D/Q/M/V).
#
#  Tous déclarés en `bindd` (avec description) → l'aide rofi
#  (SUPER+F1 ou SUPER+!) est générée automatiquement depuis ce fichier.
#  Format : bindd = MODS, touche, Catégorie · description, dispatcher, args
# ──────────────────────────────────────────────────────────────

$mainMod = SUPER
$S   = ~/.config/hypr/scripts
$wm  = ~/.config/hypr/scripts/wm.sh
$osd = ~/.config/hypr/scripts/osd.sh
$rice = ~/.config/hypr/scripts/rice.sh

# ── Aide ─────────────────────────────────────────────────────
bindd = $mainMod,       F1,     Aide · Afficher tous les raccourcis,          exec, pkill rofi || $S/keybinds.sh
bindd = $mainMod,       exclam, Aide · Afficher tous les raccourcis,          exec, pkill rofi || $S/keybinds.sh

# ── Applications ─────────────────────────────────────────────
bindd = $mainMod,       Return, Apps · Terminal,                              exec, $terminal
bindd = $mainMod,       D,      Apps · Lanceur d'applications,                exec, pkill rofi || $menu
bindd = $mainMod,       C,      Apps · Lanceur d'applications (chadwm),       exec, pkill rofi || $menu
bindd = $mainMod ALT,   E,      Apps · Gestionnaire de fichiers,              exec, $fileManager
bindd = $mainMod,       P,      Apps · Yazi (fichiers en terminal),           exec, $terminal -e yazi
bindd = $mainMod,       M,      Apps · Navigateur,                            exec, $browser
bindd = $mainMod ALT,   Tab,    Apps · Liste des fenêtres ouvertes,           exec, pkill rofi || rofi -show window
bindd = $mainMod SHIFT, V,      Apps · Historique du presse-papier,           exec, pkill rofi || $clipboard
bindd = $mainMod SHIFT, X,      Apps · Pipette de couleur,                    exec, $S/colorpicker.sh

# ── Notes ────────────────────────────────────────────────────
bindd = $mainMod,       A,      Notes · Ouvrir/cacher le scratchpad,          exec, $S/notes.sh toggle
bindd = $mainMod SHIFT, A,      Notes · Ajouter une ligne rapide,             exec, pkill rofi || $S/notes.sh quick

# ── Session ──────────────────────────────────────────────────
bindd = $mainMod,       Q,      Session · Verrouiller,                        exec, $lockscreen
bindd = $mainMod,       Escape, Session · Menu alimentation,                  exec, pkill rofi || $powermenu
bindd = $mainMod SHIFT, R,      Session · Recharger Hyprland et la barre,     exec, hyprctl reload && $wm reapply && pkill -SIGUSR2 waybar
bindd = $mainMod CTRL,  Q,      Session · Quitter Hyprland,                   exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bindd = $mainMod SHIFT, C,      Session · Quitter Hyprland,                   exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

# ── Notifications ────────────────────────────────────────────
bindd = $mainMod,       N,      Notifs · Ne pas déranger on/off,              exec, $S/dnd.sh
bindd = $mainMod SHIFT, N,      Notifs · Centre de notifications,             exec, swaync-client -t -sw
bindd = $mainMod ALT,   N,      Système · Lumière nocturne on/off,            exec, $S/hyprnight.sh toggle

# ── Barre & look ─────────────────────────────────────────────
bindd = $mainMod,       B,      Barre · Cacher/afficher,                      exec, pkill -SIGUSR1 waybar
bindd = $mainMod CTRL,  B,      Barre · Mode suivant (îles/flottante/collée), exec, $rice bar next
bindd = $mainMod SHIFT, B,      Look · Basculer neon / glass,                 exec, $rice look toggle
bindd = $mainMod ALT,   B,      Look · Menu rice (barre + look + stats),              exec, pkill rofi || $rice menu
bindd = $mainMod ALT,   S,      Barre · Basculer usage Claude / CPU-RAM,      exec, $rice stats toggle

# ── Fenêtres (chadwm) ────────────────────────────────────────
bindd = $mainMod SHIFT, Q,      Fenêtre · Fermer,                             killactive,
bindd = $mainMod,       V,      Fenêtre · Flottante/tuilée,                   togglefloating,
bindd = $mainMod SHIFT, space,  Fenêtre · Flottante/tuilée (chadwm),          togglefloating,
bindd = $mainMod,       F,      Fenêtre · Plein écran,                        fullscreen, 0
bindd = $mainMod ALT,   F,      Fenêtre · Maximiser (garde la barre),         fullscreen, 1
bindd = $mainMod,       J,      Fenêtre · Focus suivante,                     cyclenext,
bindd = $mainMod,       K,      Fenêtre · Focus précédente,                   cyclenext, prev
bindd = $mainMod SHIFT, J,      Fenêtre · Échanger avec la suivante,          swapnext,
bindd = $mainMod SHIFT, K,      Fenêtre · Échanger avec la précédente,        swapnext, prev
bindd = $mainMod SHIFT, Return, Fenêtre · Zoom (passer en principale),        exec, $wm zoom
bindde = $mainMod,      H,      Fenêtre · Réduire la zone principale (mfact), exec, $wm mfact -0.05
bindde = $mainMod,      L,      Fenêtre · Agrandir la zone principale (mfact),exec, $wm mfact +0.05
bindde = $mainMod SHIFT, H,     Fenêtre · Agrandir dans la pile (cfact),      exec, $wm cfact 40
bindde = $mainMod SHIFT, L,     Fenêtre · Réduire dans la pile (cfact),       exec, $wm cfact -40
bindd = $mainMod SHIFT, O,      Fenêtre · Réinitialiser les proportions,      exec, $wm mfact reset
bindd = $mainMod,       I,      Fenêtre · +1 fenêtre en zone master,          exec, $wm nmaster +
bindd = $mainMod ALT,   D,      Fenêtre · −1 fenêtre en zone master,          exec, $wm nmaster -
bindd = $mainMod,       E,      Fenêtre · Cacher (minimiser),                 exec, $wm hide
bindd = $mainMod SHIFT, E,      Fenêtre · Restaurer la dernière cachée,       exec, $wm restore
bindd = $mainMod CTRL,  E,      Fenêtre · Voir les fenêtres cachées,          exec, $wm hidden
bindd = $mainMod CTRL,  W,      Fenêtre · Onglets : grouper/dégrouper,        togglegroup,
bindd = $mainMod CTRL,  Tab,    Fenêtre · Onglets : suivant,                  changegroupactive, f
bindd = $mainMod CTRL SHIFT, Tab, Fenêtre · Onglets : précédent,              changegroupactive, b
bindd = $mainMod ALT,   W,      Fenêtre · Onglets : sortir du groupe,         moveoutofgroup,
bindd = $mainMod ALT,   J,      Fenêtre · Changer le sens du découpage,       layoutmsg, togglesplit
bindd = $mainMod ALT,   K,      Fenêtre · Inverser les deux moitiés,          layoutmsg, swapsplit
bindd = $mainMod ALT,   C,      Fenêtre · Centrer (flottante),                centerwindow,
bindd = $mainMod ALT,   P,      Fenêtre · Pseudo-tuilage,                     pseudo,
bindd = $mainMod CTRL,  P,      Fenêtre · Épingler sur tous les workspaces,   pin,
bindd = $mainMod ALT,   V,      Fenêtre · Mode picture-in-picture,            exec, $wm pip
bindd = $mainMod ALT,   O,      Fenêtre · Opacité forcée on/off,              setprop, active opaque toggle
bindd = $mainMod,       twosuperior, Fenêtre · Focus urgente ou précédente,   focusurgentorlast,

# Focus / déplacement / redimensionnement directionnels
bindd = $mainMod,       up,     Fenêtre · Focus en haut,                      movefocus, u
bindd = $mainMod,       down,   Fenêtre · Focus en bas,                       movefocus, d
bindd = $mainMod ALT,   left,   Fenêtre · Focus à gauche,                     movefocus, l
bindd = $mainMod ALT,   right,  Fenêtre · Focus à droite,                     movefocus, r
bindd = $mainMod ALT,   up,     Fenêtre · Focus en haut,                      movefocus, u
bindd = $mainMod ALT,   down,   Fenêtre · Focus en bas,                       movefocus, d
bindd = $mainMod SHIFT, left,   Fenêtre · Déplacer à gauche,                  movewindow, l
bindd = $mainMod SHIFT, right,  Fenêtre · Déplacer à droite,                  movewindow, r
bindd = $mainMod SHIFT, up,     Fenêtre · Déplacer en haut,                   movewindow, u
bindd = $mainMod SHIFT, down,   Fenêtre · Déplacer en bas,                    movewindow, d
bindde = $mainMod CTRL, left,   Fenêtre · Rétrécir en largeur,                resizeactive, -40 0
bindde = $mainMod CTRL, right,  Fenêtre · Élargir,                            resizeactive, 40 0
bindde = $mainMod CTRL, up,     Fenêtre · Rétrécir en hauteur,                resizeactive, 0 -40
bindde = $mainMod CTRL, down,   Fenêtre · Agrandir en hauteur,                resizeactive, 0 40
bindd = $mainMod,       R,      Fenêtre · Mode redimensionnement (Échap),     submap, resize

# Souris
binddm = $mainMod, mouse:272,   Souris · Déplacer la fenêtre,                 movewindow
binddm = $mainMod, mouse:273,   Souris · Redimensionner la fenêtre,           resizewindow
bindd = $mainMod,  mouse:274,   Souris · Flottante/tuilée,                    togglefloating,
bindd = $mainMod,  mouse_down,  Workspace · Suivant (molette),                workspace, e+1
bindd = $mainMod,  mouse_up,    Workspace · Précédent (molette),              workspace, e-1
bindd = $mainMod ALT, mouse_down, Écran · Zoom avant,                         exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.25')
bindd = $mainMod ALT, mouse_up,   Écran · Zoom arrière,                       exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '[.float / 1.25, 1] | max')

# ── Layouts (chadwm) ─────────────────────────────────────────
bindd = $mainMod,       T,      Layout · Tile (master-stack),                 exec, $wm layout master
bindd = $mainMod SHIFT, F,      Layout · Monocle,                             exec, $wm layout monocle
bindd = $mainMod ALT,   M,      Layout · Spirale (dwindle · par défaut),       exec, $wm layout dwindle
bindd = $mainMod CTRL,  G,      Layout · Grille 2×2 (dwindle),                exec, $wm layout dwindle
bindd = $mainMod CTRL,  S,      Layout · Défilant (scrolling),                exec, $wm layout scrolling
bindd = $mainMod CTRL,  space,  Layout · Revenir au précédent,                exec, $wm layout prev
bindd = $mainMod CTRL,  comma,  Layout · Précédent dans la liste,             exec, $wm layout cycle-
bindd = $mainMod CTRL,  semicolon, Layout · Suivant dans la liste,            exec, $wm layout cycle+
bindd = $mainMod CTRL SHIFT, T, Layout · Tout le workspace flottant/tuilé,    exec, $wm allfloat
bindd = $mainMod ALT,   G,      Layout · Mode jeu (sans effets) on/off,       exec, $wm gamemode

# ── Gaps (chadwm ; 6-9 = touches - è _ ç en AZERTY) ─────────
bindd = $mainMod CTRL,  T,      Gaps · Activer/désactiver,                    exec, $wm gaps toggle
bindde = $mainMod CTRL, I,      Gaps · Tous +,                                exec, $wm gaps all 1
bindde = $mainMod CTRL, D,      Gaps · Tous −,                                exec, $wm gaps all -1
bindde = $mainMod SHIFT, I,     Gaps · Intérieurs +,                          exec, $wm gaps inner 1
bindde = $mainMod CTRL SHIFT, I, Gaps · Intérieurs −,                         exec, $wm gaps inner -1
bindde = $mainMod CTRL, O,      Gaps · Extérieurs +,                          exec, $wm gaps outer 1
bindde = $mainMod CTRL SHIFT, O, Gaps · Extérieurs −,                         exec, $wm gaps outer -1
bindde = $mainMod CTRL, minus,  Gaps · Intérieurs horizontaux +,              exec, $wm gaps ih 1
bindde = $mainMod CTRL SHIFT, minus, Gaps · Intérieurs horizontaux −,         exec, $wm gaps ih -1
bindde = $mainMod CTRL, egrave, Gaps · Intérieurs verticaux +,                exec, $wm gaps iv 1
bindde = $mainMod CTRL SHIFT, egrave, Gaps · Intérieurs verticaux −,          exec, $wm gaps iv -1
bindde = $mainMod CTRL, underscore, Gaps · Extérieurs horizontaux +,          exec, $wm gaps oh 1
bindde = $mainMod CTRL SHIFT, underscore, Gaps · Extérieurs horizontaux −,    exec, $wm gaps oh -1
bindde = $mainMod CTRL, ccedilla, Gaps · Extérieurs verticaux +,              exec, $wm gaps ov 1
bindde = $mainMod CTRL SHIFT, ccedilla, Gaps · Extérieurs verticaux −,        exec, $wm gaps ov -1
bindd = $mainMod CTRL SHIFT, D, Gaps · Valeurs par défaut,                    exec, $wm gaps default

# ── Bordures (chadwm) ────────────────────────────────────────
bindde = $mainMod SHIFT, parenright, Bordure · Plus fine (touche à la place du - QWERTY), exec, $wm border -1
bindde = $mainMod SHIFT, P,     Bordure · Plus épaisse,                       exec, $wm border 1
bindd = $mainMod SHIFT, W,      Bordure · Épaisseur par défaut,               exec, $wm border default

# ── Workspaces & écrans ──────────────────────────────────────
bindd = $mainMod,       left,   Workspace · Précédent (chadwm),               workspace, r-1
bindd = $mainMod,       right,  Workspace · Suivant (chadwm),                 workspace, r+1
bindd = $mainMod,       Tab,    Workspace · Revenir au dernier,               workspace, previous
bindd = $mainMod,       S,      Workspace · Scratchpad afficher/cacher,       togglespecialworkspace, magic
bindd = $mainMod SHIFT, S,      Workspace · Envoyer au scratchpad,            movetoworkspace, special:magic
bindd = $mainMod,       comma,  Écran · Focus écran précédent,                focusmonitor, -1
bindd = $mainMod,       semicolon, Écran · Focus écran suivant,               focusmonitor, +1
bindd = $mainMod SHIFT, comma,  Écran · Envoyer la fenêtre à l'écran précédent, movewindow, mon:-1
bindd = $mainMod SHIFT, semicolon, Écran · Envoyer la fenêtre à l'écran suivant, movewindow, mon:+1

bindd = $mainMod, ampersand,  Workspace · Aller au 1,  workspace, 1
bindd = $mainMod, eacute,     Workspace · Aller au 2,  workspace, 2
bindd = $mainMod, quotedbl,   Workspace · Aller au 3,  workspace, 3
bindd = $mainMod, apostrophe, Workspace · Aller au 4,  workspace, 4
bindd = $mainMod, parenleft,  Workspace · Aller au 5,  workspace, 5
bindd = $mainMod, minus,      Workspace · Aller au 6,  workspace, 6
bindd = $mainMod, egrave,     Workspace · Aller au 7,  workspace, 7
bindd = $mainMod, underscore, Workspace · Aller au 8,  workspace, 8
bindd = $mainMod, ccedilla,   Workspace · Aller au 9,  workspace, 9
bindd = $mainMod, agrave,     Workspace · Aller au 10, workspace, 10

bindd = $mainMod SHIFT, ampersand,  Workspace · Envoyer la fenêtre au 1,  movetoworkspacesilent, 1
bindd = $mainMod SHIFT, eacute,     Workspace · Envoyer la fenêtre au 2,  movetoworkspacesilent, 2
bindd = $mainMod SHIFT, quotedbl,   Workspace · Envoyer la fenêtre au 3,  movetoworkspacesilent, 3
bindd = $mainMod SHIFT, apostrophe, Workspace · Envoyer la fenêtre au 4,  movetoworkspacesilent, 4
bindd = $mainMod SHIFT, parenleft,  Workspace · Envoyer la fenêtre au 5,  movetoworkspacesilent, 5
bindd = $mainMod SHIFT, minus,      Workspace · Envoyer la fenêtre au 6,  movetoworkspacesilent, 6
bindd = $mainMod SHIFT, egrave,     Workspace · Envoyer la fenêtre au 7,  movetoworkspacesilent, 7
bindd = $mainMod SHIFT, underscore, Workspace · Envoyer la fenêtre au 8,  movetoworkspacesilent, 8
bindd = $mainMod SHIFT, ccedilla,   Workspace · Envoyer la fenêtre au 9,  movetoworkspacesilent, 9
bindd = $mainMod SHIFT, agrave,     Workspace · Envoyer la fenêtre au 10, movetoworkspacesilent, 10

# Extra : CTRL+chiffre = emmener la fenêtre ET la suivre
bindd = $mainMod CTRL, ampersand,  Workspace · Emmener la fenêtre au 1,  movetoworkspace, 1
bindd = $mainMod CTRL, eacute,     Workspace · Emmener la fenêtre au 2,  movetoworkspace, 2
bindd = $mainMod CTRL, quotedbl,   Workspace · Emmener la fenêtre au 3,  movetoworkspace, 3
bindd = $mainMod CTRL, apostrophe, Workspace · Emmener la fenêtre au 4,  movetoworkspace, 4
bindd = $mainMod CTRL, parenleft,  Workspace · Emmener la fenêtre au 5,  movetoworkspace, 5

# ── Captures ─────────────────────────────────────────────────
bindd = ,       Print,  Capture · Zone (fichier),                             exec, hyprshot -m region -s -- ~/.local/bin/desktop/desk-shot
bindd = SHIFT,  Print,  Capture · Écran entier (fichier),                     exec, hyprshot -m output -s -- ~/.local/bin/desktop/desk-shot
bindd = SUPER,  Print,  Capture · Fenêtre (fichier),                          exec, hyprshot -m window -s -- ~/.local/bin/desktop/desk-shot
bindd = ,       XF86SelectiveScreenshot, Capture · Zone (fichier),            exec, hyprshot -m region -s -- ~/.local/bin/desktop/desk-shot
bindd = SHIFT,  XF86SelectiveScreenshot, Capture · Écran entier (fichier),    exec, hyprshot -m output -s -- ~/.local/bin/desktop/desk-shot
bindd = SUPER,  XF86SelectiveScreenshot, Capture · Fenêtre (fichier),         exec, hyprshot -m window -s -- ~/.local/bin/desktop/desk-shot
bindd = $mainMod,      U,       Capture · Zone → presse-papier (chadwm),      exec, hyprshot -m region --clipboard-only
bindd = $mainMod CTRL, U,       Capture · Écran → presse-papier (chadwm),     exec, hyprshot -m output --clipboard-only

# ── Multimédia (OSD swayosd) ─────────────────────────────────
binddel = , XF86AudioRaiseVolume,  Média · Volume +,          exec, $osd vol-up
binddel = , XF86AudioLowerVolume,  Média · Volume −,          exec, $osd vol-down
binddl  = , XF86AudioMute,         Média · Couper le son,     exec, $osd vol-mute
binddl  = , XF86AudioMicMute,      Média · Couper le micro,   exec, $osd mic-mute
binddel = , XF86MonBrightnessUp,   Média · Luminosité +,      exec, $osd bri-up
binddel = , XF86MonBrightnessDown, Média · Luminosité −,      exec, $osd bri-down
binddl  = , XF86AudioNext,         Média · Piste suivante,    exec, playerctl next
binddl  = , XF86AudioPause,        Média · Lecture/pause,     exec, playerctl play-pause
binddl  = , XF86AudioPlay,         Média · Lecture/pause,     exec, playerctl play-pause
binddl  = , XF86AudioPrev,         Média · Piste précédente,  exec, playerctl previous

# ── Sous-mode redimensionnement (SUPER+R, Échap pour sortir) ─
submap = resize
bindde = , right, Redim · Élargir,               resizeactive, 30 0
bindde = , left,  Redim · Rétrécir,              resizeactive, -30 0
bindde = , up,    Redim · Rétrécir en hauteur,   resizeactive, 0 -30
bindde = , down,  Redim · Agrandir en hauteur,   resizeactive, 0 30
bindde = , L,     Redim · Élargir,               resizeactive, 30 0
bindde = , H,     Redim · Rétrécir,              resizeactive, -30 0
bindde = , K,     Redim · Rétrécir en hauteur,   resizeactive, 0 -30
bindde = , J,     Redim · Agrandir en hauteur,   resizeactive, 0 30
bindd  = , escape, Redim · Quitter le mode,      submap, reset
bindd  = , Return, Redim · Quitter le mode,      submap, reset
submap = reset
