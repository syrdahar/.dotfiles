# ──────────────────────────────────────────────────────────────
#  Command center — submap "leader" (SUPER+Espace, puis UNE touche)
#
#  Chaque lettre lance "desk leader <module>" : le script quitte le leader
#  puis lance l'action. La notification which-key liste les binds décrits
#  ci-dessous (lus dans hyprctl binds) et se ferme toute seule.
#
#  Ordre important (Hyprland 0.56, KeybindManager) :
#   1. modificateurs seuls → "submap, leader" (ne rien faire) : sinon le
#      catchall annulerait le leader dès qu'on appuie sur SUPER ;
#   2. les actions ;
#   3. catchall EN DERNIER : toute autre touche est avalée et ferme le leader
#      (il se déclenche aussi après une action, ce qui ferme le leader).
#  Les variantes « SUPER encore enfoncé » sont des `bind` sans description
#  (masquées de la cheatsheet et de la notification).
# ──────────────────────────────────────────────────────────────

submap = leader

bind  = , Super_L,       submap, leader
bind  = , Super_R,       submap, leader
bind  = SUPER, Super_L,  submap, leader
bind  = SUPER, Super_R,  submap, leader
bind  = , Shift_L,       submap, leader
bind  = , Shift_R,       submap, leader

bindd = , space,  Palette · Palette de commandes ‖ Palette · Command palette,             exec, $desk leader palette
bindd = , H,      Aide · Cheatsheet de tous les raccourcis ‖ Help · Cheatsheet of all shortcuts,   exec, $desk leader cheatsheet
bindd = , T,      Scratchpad · Terminal (tmux) afficher/cacher ‖ Scratchpad · Toggle terminal (tmux), exec, $desk leader scratch term
bindd = , B,      Scratchpad · btop afficher/cacher ‖ Scratchpad · Toggle btop,          exec, $desk leader scratch btop
bindd = , C,      Presse-papier · Actions selon le contenu copié ‖ Clipboard · Actions for copied content, exec, $desk leader clip
bindd = , Q,      Calcul · Calculatrice et conversions (qalc) ‖ Calc · Calculator and unit conversions (qalc), exec, $desk leader calc
bindd = , G,      Git · Menu git du dossier courant ‖ Git · Git menu for current directory,          exec, $desk leader git
bindd = , P,      Projet · Ouvrir / rejoindre un projet ‖ Project · Open / switch to a project,      exec, $desk leader project
bindd = , D,      Docker · Conteneurs ‖ Docker · Containers,                        exec, $desk leader docker
bindd = , K,      Ports · Ports en écoute et processus ‖ Ports · Listening ports and processes,       exec, $desk leader ports
bindd = , S,      SSH · Se connecter à un hôte ‖ SSH · Connect to a host,               exec, $desk leader ssh
bindd = , W,      Web · Recherche (gh mdn npm aur so…) ‖ Web · Search (gh mdn npm aur so…),       exec, $desk leader web
bindd = , M,      Mobile · scrcpy / émulateur / adb ‖ Mobile · scrcpy / emulator / adb,          exec, $desk leader mobile
bindd = , R,      Capture · Captures (OCR · annotation · vidéo…) ‖ Screenshot · Captures (OCR · annotate · video…), exec, $desk leader capture
bindd = , A,      IA · Claude sur le presse-papier (expliquer · corriger · tests…) ‖ AI · Claude on clipboard (explain · fix · tests…), exec, $desk leader ai
bindd = , I,      IA · ChatGPT question rapide (calcul · conversion · info) ‖ AI · ChatGPT quick question (math · conversion · facts), exec, $desk leader gpt
bindd = , U,      Processus · Par CPU / RAM (tuer · inspecter) ‖ Processes · By CPU / RAM (kill · inspect), exec, $desk leader procs
bindd = , X,      Système · Audio · Wi-Fi · Bluetooth · VPN · session ‖ System · Audio · Wi-Fi · Bluetooth · VPN · session, exec, $desk leader system
bindd = , N,      Notes · Notes et TODO (~/notes) ‖ Notes · Notes and TODOs (~/notes), exec, $desk leader notes
bindd = , Z,      Focus · Minuteur · pomodoro · mode focus ‖ Focus · Timer · pomodoro · focus mode, exec, $desk leader focus
bindd = , L,      Langue · Basculer français / anglais ‖ Language · Toggle French / English, exec, $desk leader lang toggle
bindd = , O,      Notifs · Claude Code (on/off · test) ‖ Notifications · Claude Code (on/off · test), exec, $desk leader claudenotify
bindd = , F,      Drive · Proton Drive (parcourir · envoyer · lien) ‖ Drive · Proton Drive (browse · upload · link), exec, $desk leader drive
bindd = , escape, Leader · Annuler ‖ Leader · Cancel,                           submap, reset

bind  = SUPER, space,    exec, $desk leader palette
bind  = SUPER, H,        exec, $desk leader cheatsheet
bind  = SUPER, T,        exec, $desk leader scratch term
bind  = SUPER, B,        exec, $desk leader scratch btop
bind  = SUPER, C,        exec, $desk leader clip
bind  = SUPER, Q,        exec, $desk leader calc
bind  = SUPER, G,        exec, $desk leader git
bind  = SUPER, P,        exec, $desk leader project
bind  = SUPER, D,        exec, $desk leader docker
bind  = SUPER, K,        exec, $desk leader ports
bind  = SUPER, S,        exec, $desk leader ssh
bind  = SUPER, W,        exec, $desk leader web
bind  = SUPER, M,        exec, $desk leader mobile
bind  = SUPER, R,        exec, $desk leader capture
bind  = SUPER, A,        exec, $desk leader ai
bind  = SUPER, I,        exec, $desk leader gpt
bind  = SUPER, U,        exec, $desk leader procs
bind  = SUPER, X,        exec, $desk leader system
bind  = SUPER, N,        exec, $desk leader notes
bind  = SUPER, Z,        exec, $desk leader focus
bind  = SUPER, L,        exec, $desk leader lang toggle
bind  = SUPER, O,        exec, $desk leader claudenotify
bind  = SUPER, F,        exec, $desk leader drive
bind  = SUPER, escape,   submap, reset

bind  = , catchall,      submap, reset
bind  = SUPER, catchall, submap, reset

submap = reset
