# ──────────────────────────────────────────────────────────────
#  hyprlock — Neon Graffiti
# ──────────────────────────────────────────────────────────────

source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/hyprlock-look.conf   # neon | glass (rice.sh look)

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = snappy, 0.2, 1, 0.3, 1
    animation = fadeIn,  1, 4, snappy
    animation = fadeOut, 1, 4, snappy
    animation = inputFieldDots, 1, 2, snappy
}

background {
    monitor =
    path = $HOME/Images/einstein.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    contrast = 1.0
    brightness = $lockBrightness
    vibrancy = 0.25
    vibrancy_darkness = 0.2
}

# ── Carte de verre (visible en look glass) ─────────────────
shape {
    monitor =
    size = 440, 520
    color = $lockCard
    rounding = 28
    border_size = 1
    border_color = $lockCardEdge
    shadow_passes = $lockCardShadow
    shadow_size = 12
    shadow_color = rgba(05030ccc)
    position = 0, 40
    halign = center
    valign = center
}

# ── Heure ────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e6ddf0ee)
    font_size = 110
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(c23d9e66)
    position = 0, 230
    halign = center
    valign = center
}

# ── Date ─────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B" | sed 's/.*/\L&/; s/^./\u&/'
    color = rgba(29b4d7ee)
    font_size = 20
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# ── Utilisateur ──────────────────────────────────────────────
label {
    monitor =
    text = 󰀄  $USER
    color = rgba(e2b620dd)
    font_size = 14
    font_family = $font SemiBold
    position = 0, -60
    halign = center
    valign = center
}

# ── Mot de passe ─────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    rounding = 16
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $lockOuter
    inner_color = $lockInner
    shadow_passes = $lockCardShadow
    shadow_size = 6
    shadow_color = rgba(05030ccc)
    font_color = rgb(e6ddf0)
    font_family = $font
    check_color = rgba($goldHexee) rgba($cyanHexee) 45deg
    fail_color = rgba(e0485aee)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = rgba($goldHexee)
    fade_on_empty = false
    placeholder_text = <span foreground="##c2b1c0">󰌾  mot de passe</span>
    hide_input = false
    position = 0, -130
    halign = center
    valign = center
}

# ── Batterie ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgba(c2b1c0cc)
    font_size = 12
    font_family = $font
    position = -30, 20
    halign = right
    valign = bottom
}
