# ──────────────────────────────────────────────────────────────
#  Hyprland — rice "Neon Graffiti"
#  Wiki : https://wiki.hypr.land/Configuring/
#  Backup de l'ancienne config : ~/.config/rice-backup-2026-09-26/
# ──────────────────────────────────────────────────────────────

source = ~/.config/hypr/colors.conf


################
### MONITORS ###
################

monitor = , preferred, auto, auto

# Problème de scaling sur Pycharm
xwayland {
    force_zero_scaling = true
}


###################
### MY PROGRAMS ###
###################

$terminal    = alacritty
$lockscreen  = pidof hyprlock || hyprlock
$fileManager = dolphin
$browser     = librewolf
$menu        = rofi -show drun
$powermenu   = ~/.config/waybar/scripts/powermenu.sh
$clipboard   = cliphist list | rofi -dmenu -p "󰅌  clipboard" -display-columns 2 | cliphist decode | wl-copy


#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE DISPLAY
exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = swayosd-server
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/sysnotify.sh
# exec-once = wl-paste --type text  --watch cliphist store   # → desktop-autostart.conf (filtre des secrets)
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/hyprnight.sh auto
exec-once = /usr/lib/polkit-kde-authentication-agent-1


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,17
env = HYPRCURSOR_SIZE,17
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in  = 3
    gaps_out = 7

    border_size = 2

    resize_on_border = true
    extend_border_grab_area = 12
    allow_tearing = false

    layout = dwindle
}

source = ~/.config/hypr/look.conf   # neon | glass → scripts/rice.sh look


animations {
    enabled = true

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = spring,         0.34, 1.36, 0.64, 1
    bezier = snappy,         0.2,  1,    0.3,  1
    bezier = linear,         0,    0,    1,    1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,             ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,           1,     4,     snappy
    animation = border,           1,     4,     easeOutQuint
    animation = borderangle,      1,     20,    easeOutQuint
    animation = windowsIn,        1,     3.2,   spring,       popin 85%
    animation = windowsOut,       1,     2,     easeOutQuint, popin 85%
    animation = windowsMove,      1,     3.2,   snappy
    animation = fadeIn,           1,     2,     quick
    animation = fadeOut,          1,     1.8,   quick
    animation = fadeDim,          1,     3,     quick
    animation = layersIn,         1,     2.5,   snappy,       fade
    animation = layersOut,        1,     1.8,   easeOutQuint, fade
    animation = workspaces,       1,     3.2,   snappy,       slide
    animation = specialWorkspace, 1,     3,     snappy,       slidevert
    animation = zoomFactor,       1,     3,     quick

    # Bordure qui tourne en continu (joli mais consomme GPU/batterie) :
    # animation = borderangle,    1,     60,    linear,       loop
}

dwindle {
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = $base
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = false
    focus_on_activate = true
}

cursor {
    hide_on_key_press = true
    inactive_timeout = 5
}


#############
### INPUT ###
#############

input {
    kb_layout = fr
    kb_variant =
    kb_model =
    kb_options = caps:swapescape
    kb_rules =

    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        scroll_factor = 0.8
    }
}

gesture = 3, up, fullscreen
gesture = 3, horizontal, workspace
gesture = 3, down, close

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# Tous les raccourcis : keybinds.conf (aide rofi : SUPER+F1)
source = ~/.config/hypr/keybinds.conf


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = jetbrains-awt-popup-fix
    match:class = ^(jetbrains-.*)$
    match:title = ^(win[0-9]+)$
    no_initial_focus = on
    float = on
}

windowrule {
    # Ignore maximize requests from all apps.
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule {
    # Petites fenêtres utilitaires en flottant, centrées
    name = float-utilities
    match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|nwg-displays|org.kde.polkit-kde-authentication-agent-1)$
    float = on
    size = 900 600
    center = on
}

windowrule {
    name = float-dialogs
    match:title = ^(Open File|Save As|Open Folder|Choose Files|Ouvrir un fichier|Enregistrer sous|Picture-in-Picture)$
    float = on
    center = on
}

windowrule {
    # Les vidéos/jeux restent opaques
    name = opaque-media
    match:class = ^(mpv|vlc|librewolf|firefox|brave-browser|figma-linux)$
    opaque = on
}

# ── Layers : blur sous la barre, rofi et les notifs ──────────
layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = on
    ignore_alpha = 0.3
}

layerrule {
    name = blur-rofi
    match:namespace = rofi
    blur = on
    ignore_alpha = 0.3
    animation = popin 90%
}

layerrule {
    name = blur-swaync
    match:namespace = ^(swaync-control-center|swaync-notification-window)$
    blur = on
    ignore_alpha = 0.3
}

windowrule {
    # Tableau de bord cswap ouvert depuis le widget Claude de la barre
    name = float-cswap-tui
    match:class = ^(cswap-tui)$
    float = on
    size = 1000 640
    center = on
}

layerrule {
    name = blur-swayosd
    match:namespace = swayosd
    blur = on
    ignore_alpha = 0.3
}

windowrule {
    # Notes à la volée (scripts/notes.sh, SUPER+A)
    name = notes-scratchpad
    match:class = ^(notes-scratch)$
    workspace = special:notes silent
    float = on
    size = monitor_w*0.5 monitor_h*0.6
    center = on
}

windowrule {
    # Fenêtres cachées (SUPER+ALT+E) : on les voit flotter quand on ouvre le tiroir
    name = hidden-drawer
    match:workspace = special:hidden
    opacity = 0.9
}

windowrule {
    # btop ouvert depuis les modules CPU / RAM de la barre
    name = float-btop
    match:class = ^(btop-float)$
    float = on
    size = monitor_w*0.6 monitor_h*0.65
    center = on
}

# ── Command center (~/.local/bin/desktop) ──
source = ~/.config/hypr/desktop-binds.conf
source = ~/.config/hypr/desktop-leader.conf
source = ~/.config/hypr/desktop-rules.conf
source = ~/.config/hypr/desktop-autostart.conf
