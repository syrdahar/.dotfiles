# ──────────────────────────────────────────────────────────────
#  hypridle — verrouillage / extinction auto
#  La mise en veille n'a lieu que sur batterie, pour ne pas
#  interrompre les tâches longues quand le PC est branché.
# ──────────────────────────────────────────────────────────────

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false        # une vidéo / un appel bloque l'idle
}

# 4 min : on baisse la luminosité
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min : verrouillage
# listener {
#     timeout = 300
#     on-timeout = loginctl lock-session
# }
# 
# # 6 min : écran éteint
# listener {
#     timeout = 360
#     on-timeout = hyprctl dispatch dpms off
#     on-resume = hyprctl dispatch dpms on && brightnessctl -r
# }

# 20 min : mise en veille, uniquement sur batterie
listener {
    timeout = 1200
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = "0" ] && systemctl suspend
}
