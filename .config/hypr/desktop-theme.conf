# ──────────────────────────────────────────────────────────────
#  Fond d'écran (awww) + thème auto (desk theme) — remplace hyprpaper
#  (hyprpaper est commenté dans hyprland.conf, pas supprimé).
#   desk wall login : fond aléatoire en fondu au démarrage, palette auto
#   desk wall watch : nouvelle image dans ~/Images/Wallpapers → affichée
#  Sourcé en fin de hyprland.conf (après les animations du look).
# ──────────────────────────────────────────────────────────────

exec-once = awww-daemon
exec-once = ~/.local/bin/desktop/desk wall login
exec-once = ~/.local/bin/desktop/desk wall watch
source = ~/.config/hypr/look-post.conf   # animations propres au look (rice.sh)
