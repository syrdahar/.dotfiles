# ──────────────────────────────────────────────────────────────
#  Dictée locale (desk dictate → voxtype, Whisper large-v3-turbo sur GPU Vulkan, hors-ligne)
#  Config : ~/.config/voxtype/config.toml · service : systemctl --user status voxtype
#  La touche micro envoie appui+relâché en même temps (vérifié avec wev)
#  → mode bascule : ALT+micro démarre, ALT+micro arrête et tape le texte.
#  Seule, la touche micro garde son rôle (couper le micro, keybinds.conf).
# ──────────────────────────────────────────────────────────────

bindd = ALT,       XF86AudioMicMute, Dictée · Démarrer / arrêter (texte tapé au curseur) ‖ Dictation · Start / stop (text typed at cursor),               exec, $desk dictate toggle
bindd = ALT SHIFT, XF86AudioMicMute, Dictée · Démarrer / arrêter avec nettoyage IA (ollama) ‖ Dictation · Start / stop with AI cleanup (ollama),        exec, $desk dictate clean
bindd = ALT CTRL,  XF86AudioMicMute, Dictée · Annuler l'enregistrement en cours ‖ Dictation · Cancel current recording,                                 exec, $desk dictate cancel
