# ──────────────────────────────────────────────────────────────
#  Look "flat" : fenêtres opaques, bordure unie, sans blur ni ombre
#  Activé via ~/.config/hypr/look.conf → looks/flat.conf (rice.sh)
# ──────────────────────────────────────────────────────────────

general {
    col.active_border   = $cyan
    col.inactive_border = rgba(49345966)
}

decoration {
    rounding = 6
    rounding_power = 2.5

    active_opacity   = 1.0
    inactive_opacity = 1.0

    dim_inactive = false

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}
