# ──────────────────────────────────────────────────────────────
#  Command center — binds directs (scripts : ~/.local/bin/desktop/)
#  Même format que keybinds.conf :
#    bindd = MODS, touche, Catégorie · description, dispatcher, args
#  → visibles dans la palette (SUPER+X), la cheatsheet (SUPER+Espace puis h)
#    et l'aide existante (SUPER+F1).
# ──────────────────────────────────────────────────────────────

$desk = ~/.local/bin/desktop/desk

bindd = $mainMod,     space,  Leader · Mode leader (une lettre ensuite · Échap annule) ‖ Leader · Leader mode (then one key · Esc cancels), exec, $desk leader enter
bindd = $mainMod,     X,      Palette · Palette de commandes ‖ Palette · Command palette,                          exec, pkill rofi || $desk palette
bindd = $mainMod ALT, Return, Scratchpad · Terminal (tmux) afficher/cacher ‖ Scratchpad · Toggle terminal (tmux),            exec, $desk scratch term
