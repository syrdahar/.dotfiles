# ──────────────────────────────────────────────────────────────
#  Exemple de config de projet pour « desk project » (fichier bash).
#  Copier en <nom-du-dossier-du-projet>.conf (ou : palette → « Projet · Configurer »).
#  Tout est optionnel.
# ──────────────────────────────────────────────────────────────

# Commandes lancées au démarrage, chacune dans sa fenêtre tmux ("nom:commande")
cmds=(
    "dev:npm run dev"
    # "metro:npx expo start"
    # "api:docker compose up"
)

# URL ouverte dans le navigateur après url_delay secondes
url="http://localhost:3000"
url_delay=5

# Appareil mobile à lancer : "scrcpy" (téléphone USB) ou "emulator:<nom de l'AVD>"
# mobile="scrcpy"

# Commande d'éditeur dans la fenêtre tmux "edit" (défaut : nvim .)
# editor="nvim ."
