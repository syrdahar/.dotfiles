# ──────────────────────────────────────────────────────────────
#  Look "aurora" : fenêtres translucides, bordure dégradée qui tourne,
#  ombre lumineuse teintée accent, blur moyen
#  Activé via ~/.config/hypr/look.conf → looks/aurora.conf (rice.sh)
#  La rotation de la bordure est dans post-aurora.conf
# ──────────────────────────────────────────────────────────────

general {
    col.active_border   = $cyan $magenta $gold 45deg
    col.inactive_border = rgba(49345988)
}

decoration {
    rounding = 14
    rounding_power = 2.5

    active_opacity   = 0.92
    inactive_opacity = 0.85

    dim_inactive = true
    dim_strength = 0.05

    shadow {
        enabled = true
        range = 30
        render_power = 3
        offset = 0 0
        color = rgba(c23d9e55)
        color_inactive = rgba(29b4d722)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.015
        contrast = 1.05
        brightness = 0.95
        vibrancy = 0.3
        vibrancy_darkness = 0.2
        popups = true
    }
}
