# ──────────────────────────────────────────────────────────────
#  Look "retro" : coins carrés, bordure pleine dorée, sans blur ni ombre
#  Activé via ~/.config/hypr/look.conf → looks/retro.conf (rice.sh)
# ──────────────────────────────────────────────────────────────

general {
    col.active_border   = $gold
    col.inactive_border = rgba(49345988)
}

decoration {
    rounding = 0
    rounding_power = 2.5

    active_opacity   = 1.0
    inactive_opacity = 0.97

    dim_inactive = true
    dim_strength = 0.06

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}
