# ──────────────────────────────────────────────────────────────
#  Réglages du command center (~/.local/bin/desktop) — fichier bash
# ──────────────────────────────────────────────────────────────

# Navigateur pour les liens ouverts par desk (xdg-open = navigateur par défaut du système,
# actuellement firefox ; Hyprland utilise librewolf pour SUPER+M)
DESK_BROWSER=librewolf

# Terminal (doit accepter --class, -T, --working-directory, -e)
DESK_TERMINAL=alacritty

# Moteur par défaut de « desk web » (requête sans préfixe) ; %s = requête encodée
DESK_SEARCH_DEFAULT='https://www.google.com/search?q=%s'

# Langue d'affichage par défaut : en | fr. Bascule à chaud : SUPER+Espace puis l
# (ou palette → « Language · Toggle French / English ») ; la recherche marche dans les deux.
DESK_LANG=en

# Modèle Claude pour « desk ai » (abonnement Claude Code via claude -p) : sonnet | opus | haiku | id complet
DESK_AI_MODEL=sonnet

# « desk gpt » (ChatGPT via codex exec, compte ChatGPT — SUPER+Espace puis i) :
# modèle (vide = défaut de Codex ; gpt-5.4-mini est refusé avec un compte ChatGPT),
# effort de raisonnement none (le plus rapide) | low | medium, délai max en secondes
DESK_GPT_MODEL=
DESK_GPT_EFFORT=none
DESK_GPT_TIMEOUT=45
